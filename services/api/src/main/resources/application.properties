spring.application.name=clueso-api
spring.config.import=optional:configtree:/run/secrets/
spring.main.banner-mode=off
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.jdbc.template.query-timeout=2s
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.mvc.problemdetails.enabled=true
server.port=8080
server.shutdown=graceful
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.connection-timeout=5s
server.max-http-request-header-size=8KB
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,schema
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
logging.structured.format.console=ecs
