log_format structured escape=json
  '{"time":"$time_iso8601","service":"clueso-web","status":$status,'
  '"method":"$request_method","uri":"$uri","request_time":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;
    access_log /dev/stdout structured;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/health/readiness {
        proxy_pass http://$api_upstream/actuator/health/readiness;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/v1/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Revalidate the HTML shell so a redeploy never serves a stale interface.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
